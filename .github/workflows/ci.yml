name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test -- --run

      - name: Build
        run: npm run build

      - name: Package integrity (npm pack --dry-run)
        run: |
          npm pack --dry-run --workspace=packages/core
          npm pack --dry-run --workspace=packages/react
          npm pack --dry-run --workspace=packages/meta

      - name: Dependency audit
        run: npm audit --audit-level=critical || true
