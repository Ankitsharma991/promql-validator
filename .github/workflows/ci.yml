name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      # Report every Node version instead of cancelling the rest after the first failure.
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      # The same command the local pre-push hook runs: clean build, lint, typecheck,
      # tests and bundle-size budgets, in that order.
      - name: Verify
        run: npm run verify

      - name: Package integrity (npm pack --dry-run)
        run: |
          npm pack --dry-run --workspace=packages/core
          npm pack --dry-run --workspace=packages/react
          npm pack --dry-run --workspace=packages/meta
          npm pack --dry-run --workspace=packages/monaco
          npm pack --dry-run --workspace=packages/codemirror

      - name: Dependency audit
        run: npm audit --audit-level=critical || true

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      # The example app under test also uses the Monaco and CodeMirror adapters.
      - run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run E2E suite
        run: npm run e2e
        env:
          CI: true

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build --workspace=packages/core --workspace=packages/react --workspace=packages/monaco --workspace=packages/codemirror

      - name: Build example apps (verifies real consumer builds, incl. Next.js SSR/SSG safety)
        run: npm run build:examples

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run docs:build

  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build --workspace=packages/core

      - name: Check for performance regressions vs. committed baseline
        run: npm run benchmark:check
        # Regressions are flagged only when a benchmark is both >5x slower AND >1ms
        # slower in absolute terms than scripts/benchmark-baseline.json — sub-millisecond
        # timings are noisy on shared CI runners, so a purely relative or purely absolute
        # threshold would either flap on jitter or miss real algorithmic regressions.
        # To intentionally update the baseline after a verified, real perf change:
        #   npm run build --workspace=packages/core && npm run benchmark:write-baseline
