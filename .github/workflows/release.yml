name: Release

# Run by hand (Actions → Release → Run workflow), so it never races a manual
# `npx changeset publish` from your machine.
on:
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Check the npm token is configured
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "::error::Add an NPM_TOKEN repository secret (Settings → Secrets and variables → Actions) before releasing from CI."
            exit 1
          fi

      - run: npm ci
      - run: npm run verify

      - name: Generate SBOM (CycloneDX)
        run: |
          mkdir -p sbom
          for pkg in core react meta monaco codemirror; do
            npm sbom --sbom-format cyclonedx --workspace "packages/$pkg" > "sbom/$pkg.cdx.json"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom/

      - name: Create Release Pull Request or Publish
        uses: changesets/action@v1
        with:
          publish: npm run release
          version: npm run version-packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
